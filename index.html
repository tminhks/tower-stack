<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d30" />
    <title>Tower Stack</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./brand/duck-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./brand/duck-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./brand/duck-192.png" />
    <link rel="apple-touch-icon" href="./brand/duck-apple-180.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="bg" class="bg" aria-hidden="true">
      <div class="bg-glow"></div>
    </div>

    <canvas id="scene" aria-label="Tower Stack game"></canvas>

    <img class="badge" src="./brand/buv-logo.png" alt="BUV Tech Club" width="696" height="572" />

    <div class="hud">
      <div id="score" class="score is-hidden">0</div>
      <div id="best" class="best"></div>
    </div>

    <div id="start" class="panel is-visible">
      <img class="hero-logo" src="./brand/buv-logo.png" alt="" width="696" height="572" />
      <div class="title">TOWER STACK</div>
      <div class="hint">Tap to start</div>
      <div class="cam-hint">✊ ↔ 🖐 Bật <b>camera</b> ở góc trên để chơi bằng tay</div>
    </div>

    <div id="over" class="modal" role="dialog" aria-modal="true" aria-labelledby="over-title">
      <div class="modal-card">
        <span class="modal-corner modal-corner-tl" aria-hidden="true"></span>
        <span class="modal-corner modal-corner-br" aria-hidden="true"></span>

        <h2 id="over-title" class="modal-title">
          <span class="modal-lose">Thua mất rồi</span>
          <span class="modal-invite">mời bạn đăng ký workshop <span class="nowrap"><strong>Hacking Human</strong> 🥰</span></span>
        </h2>

        <div class="modal-poster">
          <img src="./brand/hacking-humans.webp" alt="Poster workshop Hacking Humans: The psychology behind social engineering" width="1280" height="720" />
        </div>

        <label class="check">
          <input type="checkbox" id="registered" />
          <span class="check-box" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
          </span>
          <span class="check-text">Đã đăng ký rồi</span>
        </label>

        <button id="retry" class="retry" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
          Chơi lại
        </button>
      </div>
    </div>

    <button id="cam" class="cam-btn" type="button" aria-pressed="false" aria-label="Chơi bằng tay qua camera">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V5.5a1.5 1.5 0 0 1 3 0V12M17 10.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1.5a6 6 0 0 1-4.6-2.2L4 16.2a1.6 1.6 0 0 1 2.4-2.1L8 15.6"/></svg>
      <span class="cam-btn-label">Camera</span>
    </button>

    <div id="cam-panel" class="cam" aria-live="polite">
      <div class="cam-view">
        <video id="cam-video" playsinline muted></video>
        <canvas id="cam-overlay" width="320" height="240"></canvas>
      </div>
      <div class="cam-status"><span id="cam-icon" class="cam-icon">⏳</span><span id="cam-text">Đang bật camera…</span></div>
    </div>

    <button id="mute" class="mute" type="button" aria-label="Mute sound" aria-pressed="false">
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
